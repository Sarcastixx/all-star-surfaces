<!DOCTYPE html>
<html lang="en">
<head>
  <script>if(location.protocol==="http:"&&/(^|\.)all-star-flooring\.com$/.test(location.hostname))location.replace("https:"+location.href.slice(5));</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Studio</title>
  <link rel="icon" href="/images/tab-32.png" type="image/png" sizes="32x32" />
  <link rel="shortcut icon" href="/images/tab-logo.ico" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script>(function(){try{var p=localStorage.getItem("as-theme")||"auto";if(p!=="light"&&p!=="dark")p="auto";var d=p==="dark"||(p!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");}catch(e){}})();</script>
  <style>
    .studio-desk { padding: 28px 0 80px; }
    .studio-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 22px; }
    .studio-tabs button.is-on { background: var(--ink); color: var(--on-ink); }
    .studio-desk .form label { display: grid; gap: 6px; font-size: 14px; }
    .studio-desk .split { align-items: start; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="logo" href="/" aria-label="ALLSTAR Surfaces home">
        <img class="logo-lockup logo-lockup-light" src="/images/logo-lockup-light.png" alt="ALLSTAR Surfaces" />
        <img class="logo-lockup logo-lockup-dark" src="/images/logo-lockup-dark.png" alt="" />
      </a>
      <div class="nav-end"><a class="nav-item" href="/">Back to the site</a></div>
    </div>
  </header>
  <main class="wrap studio-desk">
    <form class="form" data-login style="max-width:22rem;padding-top:48px">
      <p class="kicker">Studio</p>
      <h1>Staff only.</h1>
      <label>Password<input type="password" name="pin" required autocomplete="current-password"></label>
      <p class="lede" data-login-error hidden></p>
      <button class="btn" type="submit">Enter</button>
    </form>
    <div data-desk hidden>
      <p class="kicker">Studio</p>
      <h1>Everything in one place.</h1>
      <p class="lede">Remnants, jobs, home photos, and page text. The public site stays clickable.</p>
      <div class="studio-tabs">
        <button class="btn ghost is-on" type="button" data-tab="remnants">Remnants</button>
        <button class="btn ghost" type="button" data-tab="jobs">Jobs</button>
        <button class="btn ghost" type="button" data-tab="photos">Home photos</button>
        <button class="btn ghost" type="button" data-tab="copy">Page text</button>
        <button class="btn ghost" type="button" data-out>Sign out</button>
      </div>
      <section data-pane="remnants"></section>
      <section data-pane="jobs" hidden></section>
      <section data-pane="photos" hidden></section>
      <section data-pane="copy" hidden></section>
    </div>
  </main>
  <script src="/js/studio.js"></script>
</body>
</html>
