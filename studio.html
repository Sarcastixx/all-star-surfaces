<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="images/as-mark-mask.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Studio · All Star Surfaces</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>(function(){try{var p=localStorage.getItem("as-theme")||"auto";if(p!=="light"&&p!=="dark")p="auto";var d=p==="dark"||(p!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");document.documentElement.setAttribute("data-theme-pref",p);}catch(e){}})();</script>

  <script>(function(){try{var t=localStorage.getItem("as-theme");var d=t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");}catch(e){}})();</script>

</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
            <a class="logo" href="index.html" aria-label="All Star Surfaces home">
        <img class="as-mark-img" src="images/as-mark-mask.png" alt="" />
        <span class="brand-word"><span class="brand-all">ALL STAR</span><span class="brand-sub">Surfaces</span></span>
      </a>
      <p class="kicker" style="margin:0">Staff only</p>
    </div>
  </header>
  <main class="wrap" style="padding:48px 0 80px" data-studio>
    <p class="kicker">Staff only</p>
    <h1 style="font-size:clamp(36px,7vw,56px);margin:8px 0 12px">Studio</h1>
    <p class="lede">Update remnants, recent jobs, and homepage photos. This page is not linked in the public menu.</p>
    <form data-login class="form" style="padding-top:24px">
      <label>Password<input type="password" name="pin" required autocomplete="current-password"></label>
      <p data-login-error class="lede" hidden></p>
      <button class="btn" type="submit">Enter</button>
    </form>
    <div data-desk hidden>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin:24px 0;align-items:center;justify-content:space-between">
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <button type="button" class="nav-item is-on" data-tab="copy">Page text</button>
          <button type="button" class="nav-item" data-tab="photos">Photos</button>
          <button type="button" class="nav-item" data-tab="remnants">Remnants</button>
          <button type="button" class="nav-item" data-tab="jobs">Recent jobs</button>
        </div>
        <button type="button" class="btn ghost" data-out>Sign out</button>
      </div>
      <section data-pane="copy"></section>
      <section data-pane="remnants" hidden></section>
      <section data-pane="jobs" hidden></section>
      <section data-pane="photos" hidden></section>
    </div>
  </main>
  <script src="js/studio.js"></script>
</body>
</html>
