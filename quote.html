<body>
  <header class="site-header">

        <img class="logo-lockup logo-lockup-light" src="/images/logo-lockup-light.png" alt="ALLSTAR Surfaces" />

          <div class="survey-track"><span style="width:18%"></span></div>
        </div>
        <div class="survey-stage">
          <p class="kicker">The surface</p>
          <h1>What are we putting down?</h1>
          <p class="lede">Pick the floor you’re thinking about.</p>
          <div class="choice-grid">
            <label class="choice"><input type="radio" name="fun" value="Hardwood"><span class="swatch" style="--swatch:#c48a3a"></span><span class="choice-copy"><strong>Hardwood</strong><small>Oak, walnut, engineered</small></span></label>
            <label class="choice"><input type="radio" name="fun" value="Stone"><span class="swatch" style="--swatch:#5f8f9a"></span><span class="choice-copy"><strong>Stone or tile</strong><small>Porcelain, marble, limestone</small></span></label>
            <label class="choice"><input type="radio" name="fun" value="LVP"><span class="swatch" style="--swatch:#d7b48a"></span><span class="choice-copy"><strong>Luxury vinyl</strong><small>LVP or sheet vinyl</small></span></label>
            <label class="choice"><input type="radio" name="fun" value="Carpet"><span class="swatch" style="--swatch:#8e5a7c"></span><span class="choice-copy"><strong>Carpet</strong><small>Rooms or stairs</small></span></label>
            <label class="choice"><input type="radio" name="fun" value="Refinish"><span class="swatch" style="--swatch:#1f6b56"></span><span class="choice-copy"><strong>Refinish</strong><small>Sand and finish what is there</small></span></label>
            <label class="choice"><input type="radio" name="fun" value="Not sure"><span class="swatch" style="--swatch:#245b8a"></span><span class="choice-copy"><strong>Not sure yet</strong><small>Help me choose</small></span></label>
          </div>
        </div>
      </div>

      <div class="jobber-stage" id="jobberStage">
        <div class="survey-top">
          <p class="survey-count">Step 2</p>
          <div class="survey-track"><span style="width:100%;background:#c48a3a"></span></div>
        </div>
        <div class="jobber-card">
          <div class="jobber-tint"></div>
          <div id="f33d8757-0fe0-4775-8125-d3fc98ad7166-5331070"></div>
          <link rel="stylesheet" href="https://d3ey4dbjkt2f6s.cloudfront.net/assets/external/work_request_embed.css" media="screen" />
          <script src="https://d3ey4dbjkt2f6s.cloudfront.net/assets/static_link/work_request_embed_snippet.js" clienthub_id="f33d8757-0fe0-4775-8125-d3fc98ad7166-5331070" form_url="https://clienthub.getjobber.com/client_hubs/f33d8757-0fe0-4775-8125-d3fc98ad7166/public/work_request/embedded_work_request_form?form_id=5331070"></script>

      </div>
    </div>

  <script>
    (function(){
      var choices = document.querySelectorAll('.choice input');
      var stage = document.getElementById('jobberStage');
      choices.forEach(function(c){
        c.addEventListener('change', function(){
          stage.classList.add('is-on');
          stage.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    })();
  </script>
  <script src="/js/main.js"></script>
