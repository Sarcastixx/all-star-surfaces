  <style>
    .quote-wrap { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
    @media (min-width: 900px) { .quote-wrap { max-width: 1100px; padding: 40px 24px 80px; } }
    .quote-intro { margin-bottom: 24px; }
    .fun-q { margin-bottom: 28px; }

    .fun-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .fun-choice { display: flex; align-items: center; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s; }

    .fun-choice:has(input:checked) { border-color: var(--ink); background: var(--cream); }

    .jobber-tint { position: absolute; inset: 0; pointer-events: none; background: color-mix(in srgb, var(--cream) 18%, transparent); mix-blend-mode: multiply; border-radius: 16px; z-index: 2; }

<body>
  <header class="site-header">

      <a class="logo" href="/" aria-label="ALLSTAR Surfaces home">
        <img class="logo-lockup logo-lockup-light" src="/images/logo-lockup-light.png" alt="ALLSTAR Surfaces" />
        <img class="logo-lockup logo-lockup-dark" src="/images/logo-lockup-dark.png" alt="" />
      </a>
      <ul class="nav-links">
        <li><a class="nav-item" href="/">Home</a></li>
        <li><a class="nav-item" href="/portfolio">Work</a></li>
        <li><a class="nav-item" href="/services">Services</a></li>
        <li><a class="nav-item" href="/about">About</a></li>
        <li><a class="nav-item" href="/contact">Contact</a></li>
      </ul>
      <div class="nav-end">
        <a href="https://clienthub.getjobber.com/client_hubs/f33d8757-0fe0-4775-8125-d3fc98ad7166/login/new" target="_blank" rel="noreferrer" style="font-size:12px;color:var(--muted);opacity:0.55;text-decoration:none;margin-right:12px">Client hub</a>
        <button class="icon-btn menu" data-menu type="button" aria-label="Open menu">☰</button>

  <main>
    <div class="quote-wrap">
      <div class="quote-intro">
        <p class="kicker">Get a quote</p>
        <h1>Tell us about the floor.</h1>
        <p class="lede">Start with what you’re thinking, then fill in the details.</p>
      </div>

      <div class="fun-q" id="funQ">
        <h2>What are we putting down?</h2>
        <div class="fun-grid">
          <label class="fun-choice"><input type="radio" name="fun" value="Hardwood"><span class="sw" style="background:#c48a3a"></span><span>Hardwood</span></label>
          <label class="fun-choice"><input type="radio" name="fun" value="Stone"><span class="sw" style="background:#5f8f9a"></span><span>Stone or tile</span></label>
          <label class="fun-choice"><input type="radio" name="fun" value="LVP"><span class="sw" style="background:#d7b48a"></span><span>Luxury vinyl</span></label>
          <label class="fun-choice"><input type="radio" name="fun" value="Carpet"><span class="sw" style="background:#8e5a7c"></span><span>Carpet</span></label>
          <label class="fun-choice"><input type="radio" name="fun" value="Refinish"><span class="sw" style="background:#1f6b56"></span><span>Refinish</span></label>
          <label class="fun-choice"><input type="radio" name="fun" value="Not sure"><span class="sw" style="background:#245b8a"></span><span>Not sure yet</span></label>
        </div>
      </div>

      <div class="jobber-stage" id="jobberStage">
        <div class="jobber-card">
          <div class="jobber-tint"></div>
          <div id="f33d8757-0fe0-4775-8125-d3fc98ad7166-5331070"></div>
          <link rel="stylesheet" href="https://d3ey4dbjkt2f6s.cloudfront.net/assets/external/work_request_embed.css" media="screen" />
          <script src="https://d3ey4dbjkt2f6s.cloudfront.net/assets/static_link/work_request_embed_snippet.js" clienthub_id="f33d8757-0fe0-4775-8125-d3fc98ad7166-5331070" form_url="https://clienthub.getjobber.com/client_hubs/f33d8757-0fe0-4775-8125-d3fc98ad7166/public/work_request/embedded_work_request_form?form_id=5331070"></script>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap foot">
      <div>
        <p class="foot-brand"><img class="logo-lockup logo-lockup-light" src="/images/logo-lockup-light.png" alt="ALLSTAR Surfaces" /><img class="logo-lockup logo-lockup-dark" src="/images/logo-lockup-dark.png" alt="" /></p>
        <p class="foot-place">Located in Lynnwood. Founded in 2007.</p>
      </div>
      <div>
        <p class="kicker">Visit</p>
        <p>Lynnwood, WA</p>
      </div>
      <div>
        <p class="kicker">Hours</p>
        <p>Mon–Fri 8–5<br>Sat by appointment</p>
      </div>
    </div>
  </footer>
  <script>
    (function(){
      var choices = document.querySelectorAll('.fun-choice input');
      var stage = document.getElementById('jobberStage');
      choices.forEach(function(c){
        c.addEventListener('change', function(){
          stage.classList.add('is-on');
          stage.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    })();
  </script>
  <script src="/js/main.js"></script>
