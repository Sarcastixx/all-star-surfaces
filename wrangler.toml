name = "all-star-flooring"
main = "worker.js"
compatibility_date = "2026-09-15"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = false

[[durable_objects.bindings]]
name = "CATALOG"
